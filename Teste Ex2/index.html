<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Formulário</title>
</head>
<body>
    <main>
        <form onsubmit="return validar(event)">
        <div>
            <label for="form-nome">Nome</label>
            <input type="text" class="form-control" id="form-nome" required>
        </div>
        <div>
            <label for="form-email">Email</label>
            <input type="email" class="form-control" id="form-email" required>
        </div>
        <div>
            <label for="form-password">Password</label>
            <input type="password" class="form-control" id="form-password" required>
        </div>
        <div>
            <label for="form-confirmar">Confirmar password</label>
            <input type="password" class="form-control" id="form-confirmar" required>
        </div>
        <br>
        <!-- type="button" como pedido, necessita de ser mudado para submit para funcionar-->
        <button type="button">Submeter</button>
        </form>

    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


    <script src="main.js"></script>
</body>
</html>
